<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games with Proxy</title>
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        #search { width: 80%; max-width: 600px; padding: 10px; font-size: 16px; }
        #go { padding: 10px 20px; font-size: 16px; }
        .games-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .game-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; cursor: pointer; }
        .game-card:hover { background: #e0e0e0; }
        iframe { width: 100%; height: 80vh; border: none; display: none; } /* Hidden by default, shown when game loads */
    </style>
</head>
<body>
    <header>
        <h1>Unblocked Games & Proxy</h1>
        <p>Use the search to proxy any site, or pick a game below.</p>
        <input type="text" id="search" placeholder="Enter URL or search term...">
        <button id="go">Go</button>
    </header>

    <section id="games">
        <h2>Games</h2>
        <div class="games-list" id="games-list"></div>
    </section>

    <iframe id="proxy-frame"></iframe>

    <script>
        // Proxy configuration (from UV-Static)
        const prefix = __uv$config.prefix;
        const encodeUrl = __uv$config.encodeUrl;

        // Search bar functionality: Proxy any URL or Google search
        document.getElementById('go').addEventListener('click', () => {
            let input = document.getElementById('search').value.trim();
            if (!input) return;

            // If not a URL, treat as Google search
            if (!input.includes('.')) {
                input = 'https://www.google.com/search?q=' + encodeURIComponent(input);
            } else if (!input.startsWith('http')) {
                input = 'https://' + input;
            }

            // Load in iframe via proxy
            const proxiedUrl = prefix + encodeUrl(input);
            const frame = document.getElementById('proxy-frame');
            frame.src = proxiedUrl;
            frame.style.display = 'block';
        });

        // Easy-to-edit games list: Add/remove objects here
        const games = [
            { name: 'Slope', url: 'https://slope.io' },
            { name: 'Retro Bowl', url: 'https://retrobowl.com' },
            { name: '1v1.LOL', url: 'https://1v1.lol' },
            { name: 'Cookie Clicker', url: 'https://orteil.dashnet.org/cookieclicker/' },
            // Add more games like this: { name: 'New Game', url: 'https://example.com' },
        ];

        // Dynamically generate game cards
        const gamesList = document.getElementById('games-list');
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerText = game.name;
            card.addEventListener('click', () => {
                const proxiedUrl = prefix + encodeUrl(game.url);
                const frame = document.getElementById('proxy-frame');
                frame.src = proxiedUrl;
                frame.style.display = 'block';
            });
            gamesList.appendChild(card);
        });

        // Register service worker for proxy (required)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/uv/sw.js', { scope: '/uv/' });
        }
    </script>
</body>
</html>
