<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games with Proxy (UV-Static-2.0)</title>
    <!-- Updated paths for UV-Static-2.0 -->
    <script src="/active/uv/uv.bundle.js"></script>
    <script src="/active/uv/uv.config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        #search { width: 80%; max-width: 600px; padding: 10px; font-size: 16px; }
        #go { padding: 10px 20px; font-size: 16px; }
        .games-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .game-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; cursor: pointer; }
        .game-card:hover { background: #e0e0e0; }
        #proxy-frame { width: 100%; height: 80vh; border: none; display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>Unblocked Games & Proxy</h1>
        <p>Use the search to proxy any site, or pick a game below. Powered by UV-Static-2.0 + WISP.</p>
        <input type="text" id="search" placeholder="Enter URL or search term...">
        <button id="go">Go</button>
    </header>

    <section id="games">
        <h2>Games</h2>
        <div class="games-list" id="games-list"></div>
    </section>

    <iframe id="proxy-frame"></iframe>

    <script>
        // Wait briefly for __uv$config to be available from uv.config.js
        setTimeout(() => {
            if (!window.__uv$config) {
                console.error("UV config not loaded. Check /active/uv/uv.config.js path and contents.");
                alert("Proxy config failed to load – check console for errors.");
                return;
            }

            const prefix = __uv$config.prefix || '/active/service/';  // fallback if not set properly
            const encodeUrl = __uv$config.encodeUrl || ((str) => btoa(str));  // fallback to base64 if xor missing

            // Search bar: proxy any URL or Google search
            document.getElementById('go').addEventListener('click', () => {
                let input = document.getElementById('search').value.trim();
                if (!input) return;

                if (!input.includes('.')) {
                    input = 'https://www.google.com/search?q=' + encodeURIComponent(input);
                } else if (!input.startsWith('http')) {
                    input = 'https://' + input;
                }

                const proxied = prefix + encodeUrl(input);
                const frame = document.getElementById('proxy-frame');
                frame.src = proxied;
                frame.style.display = 'block';
            });

            // Easy games array – add/remove here
            const games = [
                { name: 'Slope', url: 'https://slope.io' },
                { name: 'Retro Bowl', url: 'https://retrobowl.com' },
                { name: '1v1.LOL', url: 'https://1v1.lol' },
                { name: 'Cookie Clicker', url: 'https://orteil.dashnet.org/cookieclicker/' },
                // Add more: { name: 'New Game', url: 'https://example.com' },
            ];

            const gamesList = document.getElementById('games-list');
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerText = game.name;
                card.addEventListener('click', () => {
                    const proxied = prefix + encodeUrl(game.url);
                    const frame = document.getElementById('proxy-frame');
                    frame.src = proxied;
                    frame.style.display = 'block';
                });
                gamesList.appendChild(card);
            });

            // Register service worker – updated path & scope
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/active/uv/sw.js', { scope: '/active/' })
                    .then(reg => console.log('Service Worker registered for UV proxy', reg.scope))
                    .catch(err => {
                        console.error('Service Worker registration failed:', err);
                        alert('Proxy may not work – service worker failed to register. Check file paths.');
                    });
            } else {
                console.warn('Service workers not supported in this browser.');
            }
        }, 500);  // Small delay to ensure scripts load
    </script>
</body>
</html>
